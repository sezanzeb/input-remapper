[project]
name = "input-remapper"
version = "2.2.1"
description = "A tool to change the mapping of your input device buttons"
authors = [
    { name = "Sezanzeb", email = "4t1pzast9@mozmail.com" },
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "evdev",
    "psutil",
    "dasbus",
    "pycairo",
    "PyGObject",
    "pydantic",
    "packaging",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["inputremapper*"]

[project.urls]
Homepage = "https://github.com/sezanzeb/input-remapper"

[tool.ruff.lint]
# E402: With gi.require_version we get this a lot
# RUF012: Now is not a good moment to refactor this. Maybe later
# BLE001: Bad practice, but hard to fix in hindsight
ignore = ["E402", "RUF012", "BLE001"]
# Lots of unused imports in
exclude = ["install/check_dependencies.py"]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"
